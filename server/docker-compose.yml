services:
  totp-server:
    build: .
    container_name: totp-backup-server
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/app/data          # SQLite 数据持久化（备份数据不随容器销毁）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
